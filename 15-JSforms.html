 <script>
 var title="Javascript with HTML Forms";
 
 function showData() {
	oPopWin=window.open(",'Window1','toolbar=no,status=no,width=300,height=100'")
	message = "<ul><li><b>Name:</b>" + document.contactform.name.value + "</li>; 
	message += "<li><b>E-mail:</b>" + document.contactform.email.value + "</li>";
	message += "<li><b>Cell No.:</b>" + document.contactform.mobile.value + "</ul>;
	oPopWin.document.write(message);
}

</script>
